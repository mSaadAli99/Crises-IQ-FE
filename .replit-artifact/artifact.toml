kind = "mobile"
previewPath = "/"
title = "CrisisIQ"
version = "1.0.0"
id = "artifacts/crisis-iq"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 18378

[services.development]
run = "pnpm --filter @workspace/crisis-iq run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/crisis-iq", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/crisis-iq", "run", "serve" ]

[services.env]
PORT = "18378"
BASE_PATH = "/"
